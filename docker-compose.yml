# Docker Compose - API template + PostgreSQL

services:
  # API Dart
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: template-api
    ports:
      - "8080:8080"
    environment:
      - SERVER_ADDRESS=0.0.0.0
      - SERVER_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=app_user
      - DB_PASSWORD=app_password
      - DB_SCHEMA=app_db
      - JWT_KEY=troque_esta_chave_em_producao
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - template-network
    restart: unless-stopped

  # PostgreSQL
  postgres:
    image: postgres:18-alpine
    container_name: template-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=app_user
      - POSTGRES_PASSWORD=app_password
      - POSTGRES_DB=app_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app_user -d app_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - template-network
    restart: unless-stopped

networks:
  template-network:
    driver: bridge

volumes:
  postgres_data:
